              <div class="upi-desc">तुमच्या बँकिंग किंवा UPI ॲपमध्ये खालील UPI ID वापरा. UPI PIN कोणालाही सांगू नका.</div>
              <div class="upi-box">
                <div class="upi-l">UPI ID • कॉपी करा</div>
                <div class="upi-v" id="upiText">${DATA.upi}</div>
              </div>
              <button class="btn-copy" id="copyBtn">${ICONS.copy} UPI ID कॉपी करा</button>
              <div class="secure-note">
                ${ICONS.shield}
                <span><strong>सुरक्षा तपासणी:</strong> स्कॅन केल्यानंतर तुमच्या UPI ॲपमध्ये <strong>${DATA.name}</strong> हे नाव दिसले पाहिजे. नाव जुळल्यावरच पेमेंट पूर्ण करा.</span>
              </div>
            </div>
          </div>
        </div>

        <div class="how">
          <h3>${ICONS.shield} पेमेंट कसे पूर्ण करायचे</h3>
          <div class="how-grid">
            <div class="how-item">
              <div class="how-num">१</div>
              <b>QR स्कॅन</b>
              <span>PhonePe, GPay, Paytm किंवा BHIM उघडा आणि QR स्कॅन करा.</span>
            </div>
            <div class="how-item">
              <div class="how-num">२</div>
              <b>नाव तपासा</b>
              <span>पेमेंटपूर्वी <b>${DATA.name}</b> हे नाव सत्यापित करा.</span>
            </div>
            <div class="how-item">
              <div class="how-num">३</div>
              <b>रक्कम टाका</b>
              <span>माझा मित्र ने सांगितलेली अचूक रक्कम टाका.</span>
            </div>
            <div class="how-item">
              <div class="how-num">४</div>
              <b>मंजूर करा</b>
              <span>पेमेंट तपशील तपासा आणि UPI PIN टाका.</span>
            </div>
          </div>
        </div>

        <div class="foot">
          <div class="foot-line"></div>
          <span>${DATA.brand} · सुरक्षित UPI पेमेंट</span>
          <div class="foot-line"></div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="मोठा QR कोड">
      <div class="lightbox-content">
        <button class="lightbox-close" id="lightboxClose" aria-label="QR कोड बंद करा">${ICONS.close}</button>
        <img src="${DATA.qr}" alt="मोठा UPI QR कोड">
      </div>
    </div>
  `;

  const $ = id => shadow.getElementById(id);
  const toast = $('toast');

  function show(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  $('copyBtn').onclick = async function () {
    try {
      await navigator.clipboard.writeText(DATA.upi);
      this.innerHTML = `${ICONS.check} कॉपी झाले!`;
      this.classList.add('copied');
      show('✓ UPI ID क्लिपबोर्डवर कॉपी झाले');
      setTimeout(() => {
        this.innerHTML = `${ICONS.copy} UPI ID कॉपी करा`;
        this.classList.remove('copied');
      }, 2000);
    } catch (err) {
      const ta = document.createElement('textarea');
      ta.value = DATA.upi;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      show('✓ UPI ID क्लिपबोर्डवर कॉपी झाले');
    }
  };

  $('dlBtn').onclick = async () => {
    try {
      const res = await fetch(DATA.qr, { mode: 'cors' });
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Maza-Mitra-QR-${DATA.name.replace(/\s+/g, '_')}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      show('✓ QR कोड डाउनलोड झाला');
    } catch (e) {
      window.open(DATA.qr, '_blank');
      show('QR नवीन टॅबमध्ये उघडला. तिथून सेव्ह करा.');
    }
  };

  const openLightbox = () => $('lightbox').classList.add('open');
  const closeLightbox = () => $('lightbox').classList.remove('open');

  $('qrFrame').onclick = openLightbox;
  $('qrFrame').onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openLightbox();
    }
  };
  $('lightboxClose').onclick = closeLightbox;
  $('lightbox').onclick = (e) => { if (e.target === $('lightbox')) closeLightbox(); };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('lightbox').classList.contains('open')) closeLightbox();
  });
})();
</script>
