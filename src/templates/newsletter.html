<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#162b2a">
<meta name="description" content="{{META_DESCRIPTION}}">
<title>{{PAGE_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Serif+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/_assets/style.css">
</head>
<body>
<a class="skip-link" href="#page-1">मुख्य मजकुराकडे जा</a>
<div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>

<header class="site-header">
  <div class="site-header__inner">
<a class="site-brand" href="./">
  <span class="site-brand__mark">म</span>
      <span class="site-brand__text">
        <strong>{{EDITION_NAME}}</strong>
        <small>{{TAGLINE}}</small>
      </span>
    </a>
    <nav class="site-nav">
<a href="./">आजचा अंक</a>
      <a href="/about/">आमच्याविषयी</a>
      <a href="/advertise/">जाहिरात</a>
      <a href="/contact/">संपर्क</a>
    </nav>
    <div class="toolbar-actions">
      <span class="page-status" id="pageStatus">पृष्ठ १ / १०</span>
      <button class="tool-button" type="button" id="smallerText">A−</button>
      <button class="tool-button" type="button" id="largerText">A+</button>
      <button class="tool-button" type="button" id="themeToggle">◐</button>
      <button class="tool-button" type="button" id="printButton">▤</button>
    </div>
  </div>
</header>

<main class="publication" id="publication">
{{PAGES_HTML}}
</main>

<footer class="site-footer">
  <div class="footer-grid">
    <div class="footer-brand">
      <div class="footer-mark">म</div>
      <div>
        <strong>{{EDITION_NAME}}</strong>
        <span>{{TAGLINE}}</span>
      </div>
    </div>
    {{FOOTER_COLUMNS}}
  </div>
  <div class="footer-bottom">
    <span>© {{YEAR}} माझा मित्र · सर्व हक्क राखीव</span>
    <span>{{ISSUE_DATE}}</span>

<!-- ═══════════════════════════════════════════════════
     FLOATING CONTACT WIDGET
     ═══════════════════════════════════════════════════ -->

<!-- Floating Button -->
<button class="float-contact-btn" id="floatContactBtn" aria-label="संपर्क करा">
  <span class="float-icon">💬</span>
  <span class="float-label">संपर्क</span>
</button>

<!-- Modal Overlay -->
<div class="float-modal-overlay" id="floatModal">
  <div class="float-modal">
    <button class="float-modal-close" id="floatClose" aria-label="बंद करा">✕</button>
    
    <div class="float-modal-head">
      <div class="float-modal-icon">📬</div>
      <h3>आमच्याशी संपर्क करा</h3>
      <p>24 तासांत उत्तर देऊ</p>
    </div>
    
    <form action="https://formsubmit.co/mazamaharashtramitra@gmail.com" 
          method="POST" 
          class="float-form">
      
      <!-- FormSubmit settings -->
      <input type="hidden" name="_subject" value="📬 New Contact — माझा मित्र">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="https://mazamitra.in/thank-you/">
      <input type="text" name="_honey" style="display:none">
      
      <!-- Name -->
      <label class="float-field">
        <span class="float-label-text">तुमचं नाव <em>*</em></span>
        <input type="text" name="name" required placeholder="उदा. राहुल पाटील">
      </label>
      
      <!-- Mobile -->
      <label class="float-field">
        <span class="float-label-text">मोबाईल नंबर <em>*</em></span>
        <input type="tel" name="mobile" required placeholder="+91 98765 43210" 
               pattern="[0-9+\s]{10,15}">
      </label>
      
      <!-- Email -->
      <label class="float-field">
        <span class="float-label-text">ईमेल <em>*</em></span>
        <input type="email" name="email" required placeholder="you@example.com">
      </label>
      
      <!-- Reason -->
      <label class="float-field">
        <span class="float-label-text">कारण <em>*</em></span>
        <select name="reason" required>
          <option value="">— निवडा —</option>
          <option value="जाहिरात चौकशी">💼 जाहिरात चौकशी</option>
          <option value="Directory Listing">📞 Directory Listing (₹100)</option>
          <option value="तक्रार">⚠️ तक्रार</option>
          <option value="सूचना">💡 सूचना</option>
          <option value="लेख सबमिट">✍️ लेख सबमिट</option>
          <option value="इतर">💬 इतर</option>
        </select>
      </label>
      
      <!-- Message (Optional) -->
      <label class="float-field">
        <span class="float-label-text">संदेश <em class="optional">(ऐच्छिक)</em></span>
        <textarea name="message" rows="3" 
                  placeholder="थोडक्यात लिहा..."></textarea>
      </label>
      
      <button type="submit" class="float-submit">
        <span>📩</span> पाठवा
      </button>
      
      <p class="float-note">तुमची माहिती सुरक्षित राहील 🔒</p>
    </form>
  </div>
</div>

    
  </div>
</footer>

<script src="/_assets/script.js" defer></script>
</body>
</html>
